name: Daily predictions
on:
  schedule:
    - cron: "15 0,6,12,18 * * *" # locks tomorrow's picks and records finished results
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/update.ts
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/predictions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/predictions.json
            git commit -m "chore: update predictions data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
